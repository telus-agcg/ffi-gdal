---
inherit_from: .rubocop_todo.yml

inherit_mode:
  merge:
    - Exclude

plugins:
  - rubocop-performance
  - rubocop-rspec
  - rubocop-rake

Layout/ParameterAlignment:
  EnforcedStyle: with_fixed_indentation

Metrics/BlockLength:
  Exclude:
    - spec/**/*_spec.rb
    - spec/support/shared_examples/**/*.rb

Naming/FileName:
  Exclude:
    - lib/ffi-gdal.rb
    - spec/ffi-gdal_spec.rb

Naming/MethodParameterName:
  AllowedNames: [x, y, z]

Style/Documentation:
  Enabled: false

# These files legitimately define more than one constant in a single file:
# `numeric_as_data_type.rb`/`to_bool.rb` reopen several core classes to attach
# the same extension, and `gdal.rb` defines the GDAL module alongside its
# error-handling class. Splitting them would fragment cohesive units.
Style/OneClassPerFile:
  Exclude:
    - lib/ext/numeric_as_data_type.rb
    - lib/ext/to_bool.rb
    - lib/gdal.rb

Style/StringLiterals:
  EnforcedStyle: double_quotes

# Keep existing explicit hash syntax; don't force Ruby 3.1+ shorthand
# (`{x:}`) just because TargetRubyVersion was raised.
Style/HashSyntax:
  EnforcedShorthandSyntax: never

# Dir.glob/Dir[] ordering is filesystem-dependent and not guaranteed
# sorted on all platforms; keep explicit .sort for deterministic
# require order. Rubocop itself marks this cop's autocorrect unsafe.
Lint/RedundantDirGlobSort:
  Enabled: false

# Several public methods forward **options/&block by name so their YARD
# @param/@option docs stay accurate (anonymous `**`/`&` forwarding would
# make the documented parameter names disappear from the signature).
Style/ArgumentsForwarding:
  Enabled: false

Naming/BlockForwarding:
  Enabled: false

AllCops:
  DisplayCopNames: true
  DisplayStyleGuide: true
  NewCops: enable
  SuggestExtensions: false
  TargetRubyVersion: 3.4
