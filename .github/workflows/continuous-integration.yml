name: Continuous Integration

on:
  pull_request:
  push:

jobs:
  static_analysis:
    name: Rubocop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Ruby
        uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1.324.0
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Rubocop
        run: bundle exec rubocop --format github --parallel

  test:
    strategy:
      fail-fast: false
      matrix:
        # - ubuntu-22.04 has GDAL 3.4.1, PROJ 8.2.1, GEOS 3.10.2
        # - ubuntu-24.04 has GDAL 3.8.4, PROJ 9.4.0, GEOS 3.12.1
        # Pinned to specific Ubuntu versions (not "latest") so lib
        # compatibility is tracked deliberately rather than shifting
        # underneath us.
        os: ["ubuntu-22.04", "ubuntu-24.04"]
        ruby-version: ["3.4", "4.0"]
    name: "Test on Ruby ${{ matrix.ruby-version }} on ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    env:
      # rubocop/rexml (and the VM crash they were suspected of triggering
      # under Ruby 4.0 on ubuntu-22.04) are only needed for the separate
      # Rubocop job, not for running specs.
      BUNDLE_WITHOUT: lint
    steps:
      - name: Install GDAL
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends --fix-missing \
            libgdal-dev librttopo-dev
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Ruby
        uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1.324.0
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true
      - name: Run specs
        run:
          bundle exec rspec spec --format RSpec::Github::Formatter --format
          progress
