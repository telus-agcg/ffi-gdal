name: Continuous Integration

on:
  pull_request:
  push:

jobs:
  static_analysis:
    name: Rubocop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Rubocop
        run: bundle exec rubocop --format github --parallel

  test:
    strategy:
      fail-fast: false
      matrix:
        # - ubuntu-22.04 has GDAL 3.4.1, PROJ 8.2.1, GEOS 3.10.2
        # - ubuntu-24.04 has GDAL 3.8.4, PROJ 9.4.0, GEOS 3.12.1
        # Pinned to specific Ubuntu versions (not "latest") so lib
        # compatibility is tracked deliberately rather than shifting
        # underneath us.
        os: ["ubuntu-22.04", "ubuntu-24.04"]
        ruby-version: ["3.4", "4.0"]
    name: "Test on Ruby ${{ matrix.ruby-version }} on ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Install GDAL
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends --fix-missing \
            libgdal-dev librttopo-dev
      - uses: actions/checkout@v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true
      - name: Run specs
        # RUBY_YJIT_ENABLE=0: works around a Ruby 4.0 YJIT VM crash
        # ("[BUG] should have cvar cache entry" in rexml) seen intermittently
        # on ubuntu-22.04. This is a Ruby interpreter bug, not a bug in this
        # gem; remove once fixed upstream in Ruby.
        run:
          bundle exec rspec spec --format RSpec::Github::Formatter --format
          progress
        env:
          RUBY_YJIT_ENABLE: 0
